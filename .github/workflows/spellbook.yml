name: Spellbook conformance

# Runs this product's Spellbook suites (tests/spellbook) and Spellbook's conformance kit against the selected
# Spellbook baseline. Private source credentials reach only trusted branch pushes and
# manual runs; never add a pull_request_target trigger.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spellbook:
    uses: gravitywiz/spellbook/.github/workflows/product-conformance.yml@spellbook-ai/release-review-20261007
    with:
      spellbook_ref: spellbook-ai/release-review-20261007
    secrets:
      SSH_KEY_GWIZ_BUILDER: ${{ secrets.SSH_KEY_GWIZ_BUILDER }}
